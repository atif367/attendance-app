apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-app
  labels:
    app: attendance-app
spec:
  # SQLite is a single-file database on one ReadWriteOnce volume,
  # so the app runs as one pod and is replaced (not rolled) on update.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: attendance-app
  template:
    metadata:
      labels:
        app: attendance-app
    spec:
      securityContext:
        fsGroup: 1000          # "node" user group, lets the pod write to the volume
      containers:
        - name: attendance-app
          image: attendance-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: DB_PATH
              value: /data/attendance.db
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: attendance-data
